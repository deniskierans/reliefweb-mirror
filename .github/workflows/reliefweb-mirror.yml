name: ReliefWeb jobs mirror

on:
  schedule:
    - cron: "0 22 * * 1"   # Mondays 22:00 UTC, ahead of the Tuesday digest
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch ReliefWeb jobs
        run: python fetch_reliefweb.py
      - name: Commit results
        run: |
          git config user.name "reliefweb-mirror[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "ReliefWeb mirror $(date -u +%Y-%m-%d)"
          git push
